name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check whether package.json's version is already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view agent-instruction-hygiene version 2>/dev/null || echo "none")
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG_VERSION / latest on npm: $PUBLISHED_VERSION"

      - name: Publish to npm
        if: steps.check.outputs.pkg != steps.check.outputs.published
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub Release
        if: steps.check.outputs.pkg != steps.check.outputs.published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.check.outputs.pkg }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md"
